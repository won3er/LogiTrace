# Blueprint do Render: API FastAPI + PostgreSQL com PostGIS.
# O frontend (Next.js) fica na Vercel com LOGITRACE_API_URL apontando para a URL desta API.
databases:
  - name: logitrace-db
    databaseName: logitrace
    user: logitrace
    plan: free

services:
  - type: web
    name: logitrace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # deploy-init cria o PostGIS, aplica as migrações e, com o banco vazio, importa as bases públicas em segundo plano
    startCommand: python -m app.cli deploy-init && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LOGITRACE_ENV
        value: production
      - key: LOGITRACE_DATABASE_URL
        fromDatabase:
          name: logitrace-db
          property: connectionString
      - key: LOGITRACE_CORS_ORIGINS
        value: '["https://logitrace.vercel.app"]'
      - key: LOGITRACE_JOB_WORKERS
        value: "1"
